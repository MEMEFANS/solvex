<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Solvex 新手注册教程</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  :root {
    --bg1:#ffffff; --bg2:#ffffff; --panel:#ffffff; --panel2:#ffffff;
    --border:#d9e4e0; --acc:#0b7264; --acc2:#16a285; --txt:#4f605b;
    --dim:#5b6b66; --bright:#16211e; --glow:rgba(79,209,181,.35);
  }
  html,body { min-height:100%; }
  body {
    font-family:"Microsoft YaHei","PingFang SC",-apple-system,"Segoe UI",sans-serif;
    color:var(--txt); min-height:100vh; display:flex; flex-direction:column;
    background:
      radial-gradient(700px 460px at 50% -5%, rgba(79,209,181,.14), transparent 60%),
      radial-gradient(600px 380px at 50% 105%, rgba(79,209,181,.08), transparent 60%),
      linear-gradient(170deg,#ffffff 0%,#ffffff 55%,#ffffff 100%);
  }
  /* ── 顶栏 ── */
  .bar { display:flex; align-items:center; gap:10px; padding:12px clamp(10px,3vw,30px); }
  .bar .brand { display:flex; align-items:center; gap:8px; cursor:pointer; min-width:0; }
  .bar .brand img { width:30px; height:30px; border-radius:8px; box-shadow:0 0 16px rgba(16,38,32,0.16); }
  .bar .brand span { font-size:15px; font-weight:900; color:var(--bright); white-space:nowrap; }
  .bar .brand b { color:var(--acc); }
  .bar .title { flex:1; text-align:center; font-size:13px; font-weight:700; color:var(--dim); letter-spacing:2px;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .iconbtn { width:36px; height:36px; border-radius:10px; border:1px solid var(--border); background:var(--panel);
    color:var(--txt); font-size:16px; cursor:pointer; display:flex; align-items:center; justify-content:center;
    flex:0 0 auto; text-decoration:none; }
  .iconbtn:hover { border-color:#c5d3d0; }
  .langmenu { position:fixed; background:#ffffff; border:1px solid var(--border); border-radius:10px; padding:6px 0;
    z-index:99; min-width:150px; box-shadow:0 8px 28px rgba(16,38,32,.12); }
  .langmenu button { display:block; width:100%; padding:10px 16px; border:0; background:transparent; color:var(--txt);
    font:inherit; font-size:13px; text-align:left; cursor:pointer; white-space:nowrap; }
  .langmenu button.on { color:var(--acc); }
  .langmenu button:hover { background:#ffffff; }
  /* ── 播放器 ── */
  main { flex:1; width:100%; max-width:520px; margin:0 auto; padding:2px clamp(10px,3vw,24px) 24px; }
  .player { background:linear-gradient(180deg,var(--panel2),var(--panel)); border:1px solid var(--border);
    border-radius:20px; padding:10px; box-shadow:0 24px 80px rgba(16,38,32,.12); }
  .stage { position:relative; border-radius:12px; overflow:hidden; background:#ffffff; margin:0 auto; }
  .scaler { position:absolute; left:0; top:0; width:420px; height:640px; transform-origin:0 0; }
  .scene { position:absolute; inset:0; display:none; }
  .scene.on { display:block; }
  /* ── 手机壳 mockup ── */
  .phone { position:absolute; inset:12px; border-radius:26px; background:#ffffff; border:1px solid #d9e4e0;
    overflow:hidden; display:flex; flex-direction:column; box-shadow:0 18px 60px rgba(16,38,32,.12); }
  .pstatus { flex:0 0 26px; display:flex; align-items:center; justify-content:space-between; padding:0 16px;
    font-size:10.5px; color:#5b6b66; background:#ffffff; }
  .pstatus .sicons { display:flex; gap:4px; align-items:center; }
  .pstatus .sig { display:flex; gap:1.5px; align-items:flex-end; }
  .pstatus .sig i { width:2.5px; background:#a9c4be; border-radius:1px; display:inline-block; }
  .pstatus .batt { width:17px; height:8px; border:1px solid #a9c4be; border-radius:2.5px; position:relative; }
  .pstatus .batt::before { content:""; position:absolute; left:1px; top:1px; bottom:1px; width:65%; background:#38e08b; border-radius:1px; }
  .purl { flex:0 0 34px; margin:8px 12px 0; background:#ffffff; border:1px solid #c3d5d2; border-radius:17px;
    display:flex; align-items:center; justify-content:center; gap:7px; font-size:12.5px; color:var(--dim); }
  .purl .lock { color:#3a5a54; font-size:10.5px; }
  .purl.ok .lock { color:var(--acc); }
  .purl .u { color:#5b6b66; letter-spacing:.5px; }
  .caret { display:inline-block; width:1px; height:12px; background:var(--acc); vertical-align:-2px; animation:blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity:0; } }
  .msite { flex:1; position:relative; display:flex; flex-direction:column; margin-top:10px; padding:0 12px; overflow:hidden; }
  .mhead { flex:0 0 46px; display:flex; align-items:center; justify-content:space-between; gap:8px; }
  .mhead .mbrand { display:flex; align-items:center; gap:6px; font-size:13.5px; font-weight:900; color:var(--bright); }
  .mhead .mbrand img { width:20px; height:20px; border-radius:6px; box-shadow:0 0 10px rgba(16,38,32,0.16); display:inline-block; object-fit:cover; flex:0 0 20px; }
  .mhead .mbrand b { color:var(--acc); }
  .mhead .hright { display:flex; align-items:center; gap:8px; }
  .burger { width:26px; height:26px; border-radius:7px; border:1px solid var(--border); display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:3.5px; background:#ffffff; }
  .burger i { width:12px; height:1.5px; background:#9fe8d8; border-radius:1px; }
  .mconnect { padding:7px 13px; border-radius:999px; font-size:11.5px; font-weight:800; color:#ffffff;
    background:var(--acc); white-space:nowrap; }
  .mconnect.addr { background:#ffffff; color:var(--acc); border:1px solid #c0d8d3; position:relative; padding-left:22px; }
  .mconnect.addr::before { content:""; position:absolute; left:8px; top:50%; width:7px; height:7px; margin-top:-3.5px;
    border-radius:50%; background:#38e08b; box-shadow:0 0 8px #102620; }
  .mbody { flex:1; position:relative; overflow:hidden; }
  .pane { position:absolute; inset:0; display:none; }
  .pane.on { display:flex; }
  /* 首页 hero */
  .hero { flex-direction:column; align-items:center; justify-content:center; text-align:center; gap:11px; }
  .hero h1 { font-size:27px; font-weight:900; letter-spacing:3px;
    background:linear-gradient(100deg,#8ff0dc,#4fd1b5 50%,#b9f4e6); -webkit-background-clip:text; background-clip:text; color:transparent; }
  .hero p { font-size:11.5px; color:var(--dim); letter-spacing:3px; }
  .hero .bigcta { margin-top:8px; padding:10px 30px; border-radius:999px; font-size:12.5px; font-weight:900; color:#ffffff;
    background:var(--acc); box-shadow:0 10px 30px var(--glow); }
  /* 抽屉菜单（fit-content 与主站 mobile.css 口径一致） */
  .drawer { position:absolute; left:0; top:0; bottom:0; width:fit-content; min-width:150px; max-width:80vw; z-index:35;
    background:#ffffff; border:1px solid #c0d8d3; border-radius:0 14px 14px 0;
    padding:14px 10px; transform:translateX(-110%); transition:transform .38s cubic-bezier(.3,.9,.3,1); }
  .drawer.on { transform:translateX(0); }
  .drawer .dbrand { font-size:13px; font-weight:900; color:var(--bright); padding:0 8px 12px; border-bottom:1px solid #d9e4e0; display:flex; align-items:center; gap:7px; }
  .drawer .dbrand img { width:20px; height:20px; border-radius:6px; object-fit:cover; }
  .drawer .dbrand b { color:var(--acc); }
  .ditem { display:flex; align-items:center; gap:9px; padding:11px 10px; border-radius:9px; font-size:13px;
    color:var(--txt); font-weight:700; white-space:nowrap; }
  .ditem .ic { font-size:13px; opacity:.75; }
  .ditem.hl { background:rgba(79,209,181,.12); color:var(--acc); }
  /* 矿池页（竖版堆叠：子页签 / 团队卡 / 总览） */
  .subtabs { display:flex; gap:5px; margin-top:8px; }
  .subtab { padding:5px 11px; border-radius:8px; font-size:11px; color:var(--dim); background:#ffffff; border:1px solid #d9e4e0; font-weight:700; white-space:nowrap; }
  .subtab.on { color:var(--acc); background:rgba(79,209,181,.1); border-color:#c0d8d3; }
  .ts-card { margin-top:8px; border-radius:12px; border:1px solid #c2d6d2; background:linear-gradient(120deg,rgba(79,209,181,.1),rgba(79,209,181,.02)); padding:9px 11px; }
  .ts-top { display:flex; align-items:center; justify-content:space-between; font-size:10.5px; color:var(--dim); }
  .ts-top code { color:var(--acc); font-weight:800; }
  .ts-grid { display:flex; gap:8px; margin-top:7px; }
  .ts-cell { flex:1; background:#ffffff; border:1px solid #d9e4e0; border-radius:9px; padding:5px 9px; display:flex; align-items:center; justify-content:space-between; }
  .ts-cell b { font-size:15px; color:var(--bright); }
  .ts-cell b small { font-size:9.5px; color:var(--dim); font-weight:700; }
  .ts-cell .l { font-size:9.5px; color:var(--dim); margin-top:1px; }
  .ts-cell .ico { font-size:14px; }
  .plans { display:flex; flex-direction:column; gap:9px; margin-top:9px; }
  .pcard { border-radius:13px; padding:12px 14px; position:relative; background:linear-gradient(180deg,#ffffff,#ffffff);
    border:1px solid var(--border); transition:box-shadow .4s, border-color .4s; }
  .pcard.hot { border-color:#c0d8d3; }
  .pcard.sel { border-color:var(--acc); box-shadow:0 0 0 2px rgba(16,38,32,0.16), 0 0 36px rgba(16,38,32,0.15); }
  .ptag { display:inline-block; font-size:11px; font-weight:900; padding:4px 10px; border-radius:999px; color:#ffffff;
    background:var(--acc); }
  .pchip { position:absolute; top:10px; right:10px; font-size:10px; color:#0b7264; background:#ffffff;
    border:1px solid #c2d6d1; border-radius:999px; padding:3px 8px; }
  .prow { display:flex; align-items:baseline; gap:7px; margin-top:8px; }
  .prow .n { font-size:23px; font-weight:900; color:var(--acc); text-shadow:0 0 20px rgba(16,38,32,0.16); }
  .prow .u { font-size:11.5px; color:var(--dim); font-weight:700; }
  .parrow { display:flex; align-items:center; gap:7px; margin-top:4px; font-size:11px; color:#16211e; font-weight:700; flex-wrap:wrap; }
  .parrow .ab { padding:2.5px 8px; border-radius:7px; background:#ffffff; border:1px solid #c2d6d1; }
  .pstats { display:flex; gap:7px; margin-top:9px; }
  .pstat { flex:1; text-align:center; background:#ffffff; border:1px solid #d9e4e0; border-radius:8px; padding:6px 3px; }
  .pstat b { display:block; font-size:11.5px; color:var(--bright); }
  .pstat span { display:block; font-size:9.5px; color:var(--dim); margin-top:1.5px; }
  .pact { width:100%; margin-top:9px; padding:9px 0; border:0; border-radius:999px; font-size:12.5px; font-weight:900;
    color:#ffffff; background:var(--acc); cursor:default; font-family:inherit; }
  .pact.busy { background:#ffffff; color:#9f7e19; border:1px solid #d6d2c2; }
  .pact.done { background:#ffffff; color:var(--acc); border:1px solid #c0d8d3; }
  .ovcard { margin-top:8px; border:1px solid var(--border); border-radius:12px; background:#ffffff; padding:8px 10px; }
  .ovtitle { font-size:11px; color:var(--bright); font-weight:800; margin-bottom:6px; }
  .ovgrid { display:grid; grid-template-columns:repeat(2,1fr); gap:6px; }
  .ovcell { background:#ffffff; border:1px solid #d9e4e0; border-radius:8px; padding:5px 7px; }
  .ovcell .l { font-size:9px; color:var(--dim); }
  .ovcell .v { font-size:11.5px; color:var(--bright); font-weight:800; margin-top:1px; }
  .ovcell .v small { font-size:8.5px; color:var(--dim); font-weight:700; }
  .ovcell .v.c1 { color:#0b7264; }
  .ovcell .v.c2 { color:#aa700e; }
  .ovcell .v.c3 { color:#a8700a; }
  /* 我的矿池 */
  .mlist { margin-top:10px; }
  .mhead2 { display:flex; align-items:center; justify-content:space-between; }
  .mhead2 h3 { font-size:13.5px; color:var(--bright); }
  .mhead2 span { font-size:10px; color:var(--dim); }
  .mcard { margin-top:8px; border-radius:13px; padding:12px 13px; background:linear-gradient(180deg,#ffffff,#ffffff);
    border:1px solid var(--border); position:relative; overflow:hidden; }
  .mcard .accent { position:absolute; left:0; top:0; bottom:0; width:3.5px; background:linear-gradient(180deg,var(--acc2),var(--acc)); }
  .mrow { display:flex; align-items:center; justify-content:space-between; }
  .mtitle { display:flex; gap:8px; align-items:center; }
  .mtitle .mi { font-size:18px; }
  .mtitle h4 { font-size:13px; color:var(--bright); }
  .mtitle small { display:block; font-size:10px; color:var(--dim); margin-top:1.5px; }
  .pill { font-size:10.5px; font-weight:800; padding:4px 10px; border-radius:999px; }
  .pill.run { color:#0b7a3f; background:rgba(56,224,139,.1); border:1px solid rgba(56,224,139,.35); }
  .mtotal { display:flex; justify-content:space-between; align-items:baseline; margin-top:8px; font-size:11px; color:var(--dim); }
  .mtotal b { font-size:14px; color:var(--acc); }
  .mstats { display:flex; gap:6px; margin-top:8px; }
  .mstat { flex:1; background:#ffffff; border:1px solid #d9e4e0; border-radius:8px; padding:6px 4px; text-align:center; }
  .mstat span { display:block; font-size:9.5px; color:var(--dim); }
  .mstat b { display:block; font-size:11.5px; color:var(--bright); margin-top:1.5px; }
  .mstat b.pos { color:#0b7a3f; }
  .pbar { margin-top:9px; height:7px; border-radius:99px; background:#ffffff; border:1px solid #d9e4e0; overflow:hidden; }
  .pbar i { display:block; height:100%; width:0; border-radius:99px; background:linear-gradient(90deg,var(--acc),var(--acc2));
    box-shadow:0 0 12px rgba(16,38,32,0.16); transition:width 1.4s ease; }
  .pfoot { margin-top:6px; font-size:10px; color:var(--dim); }
  /* 底部弹层（手机钱包风格） */
  .dim { position:absolute; inset:0; background:rgba(16,38,32,0.14); z-index:20; display:none; }
  .dim.on { display:block; }
  .sheet { position:absolute; left:0; right:0; bottom:0; z-index:25; background:#ffffff; border:1px solid #c0d8d3;
    border-bottom:0; border-radius:18px 18px 0 0; padding:10px 14px calc(14px + env(safe-area-inset-bottom));
    transform:translateY(108%); transition:transform .4s cubic-bezier(.3,.9,.3,1); }
  .sheet.on { transform:translateY(0); }
  .sheet .grab { width:38px; height:4px; border-radius:99px; background:#e9f1ef; margin:0 auto 10px; }
  .witem { display:flex; align-items:center; gap:11px; padding:12px 10px; border-radius:11px; font-size:13px;
    color:var(--txt); font-weight:700; }
  .witem .ic { width:30px; height:30px; border-radius:9px; display:flex; align-items:center; justify-content:center;
    font-size:15px; background:#ffffff; border:1px solid #c2d6d1; }
  .witem.hl { background:rgba(79,209,181,.12); color:var(--acc); }
  .sig h4, .pay h4 { font-size:14px; color:var(--bright); text-align:center; }
  .sig .mtip { margin-top:9px; font-size:11.5px; line-height:1.7; color:var(--dim); background:#ffffff;
    border:1px solid #d9e4e0; border-radius:10px; padding:9px 11px; }
  .mbtns { display:flex; gap:10px; margin-top:13px; }
  .mbtn { flex:1; padding:11px 0; border-radius:11px; font-size:13px; font-weight:800; text-align:center; font-family:inherit; }
  .mbtn.ghost { background:#ffffff; border:1px solid #c2d6d1; color:var(--dim); }
  .mbtn.main { background:var(--acc); color:#ffffff; border:0; }
  .pay .amt { text-align:center; margin-top:4px; }
  .pay .amt b { font-size:24px; color:var(--bright); }
  .pay .amt span { display:block; font-size:10.5px; color:var(--dim); margin-top:3px; letter-spacing:1px; }
  .pay .fee { margin-top:9px; font-size:10.5px; color:var(--dim); text-align:center; }
  .spin { width:24px; height:24px; margin:10px auto 4px; border-radius:50%; border:3px solid #d9e4e0;
    border-top-color:var(--acc); animation:rot .8s linear infinite; }
  @keyframes rot { to { transform:rotate(360deg); } }
  .toast { position:absolute; top:10px; left:50%; transform:translateX(-50%) translateY(-8px); z-index:40; opacity:0;
    background:#ffffff; border:1px solid #c0d8d3; color:var(--acc); font-size:12px; font-weight:800;
    padding:8px 18px; border-radius:999px; transition:all .4s; box-shadow:0 10px 30px rgba(16,38,32,.12); white-space:nowrap; }
  .toast.on { opacity:1; transform:translateX(-50%) translateY(0); }
  /* 动画 */
  .pop { animation:pop .5s cubic-bezier(.34,1.4,.5,1) both; }
  @keyframes pop { from { opacity:0; transform:scale(.94) translateY(6px); } }
  .pulse { animation:pulse 1.15s ease-out infinite; }
  @keyframes pulse { 0% { box-shadow:0 0 0 0 rgba(16,38,32,0.16); } 70% { box-shadow:0 0 0 12px rgba(16,38,32,0); } 100% { box-shadow:0 0 0 0 rgba(16,38,32,0); } }
  .press { animation:press .22s ease; }
  @keyframes press { 40% { transform:scale(.9); } }
  .cursor { position:absolute; left:0; top:0; width:20px; height:20px; z-index:60; pointer-events:none; opacity:0;
    transition:transform .55s cubic-bezier(.4,0,.2,1), opacity .3s; }
  .cursor::before { content:""; position:absolute; inset:0; border-radius:50%; background:rgba(79,209,181,.25);
    border:2px solid var(--acc2); box-shadow:0 0 14px rgba(16,38,32,0.16); }
  .cursor::after { content:""; position:absolute; left:8px; top:8px; width:4px; height:4px; border-radius:50%; background:#fff; }
  .ripple { position:absolute; width:15px; height:15px; margin:-7.5px 0 0 -7.5px; border-radius:50%; z-index:55;
    pointer-events:none; border:2px solid var(--acc2); animation:rip .55s ease-out both; }
  @keyframes rip { from { opacity:.9; transform:scale(.4); } to { opacity:0; transform:scale(3.2); } }
  .confetti { position:absolute; width:6px; height:6px; z-index:50; pointer-events:none; border-radius:2px; animation:cf 1s ease-out both; }
  @keyframes cf { from { opacity:1; transform:translate(0,0) rotate(0); } to { opacity:0; transform:translate(var(--dx),46px) rotate(220deg); } }
  /* 字幕 & 控制 */
  .subbar { min-height:46px; display:flex; align-items:center; justify-content:center; text-align:center; padding:9px 12px 2px; }
  .subbar .sub { font-size:13.5px; font-weight:700; color:var(--bright); line-height:1.5; }
  .ctrl { display:flex; align-items:center; gap:10px; padding:6px 4px 4px; }
  .ctrl .pb { width:42px; height:42px; border-radius:50%; border:0; cursor:pointer; font-size:15px; color:#ffffff;
    background:var(--acc); display:flex; align-items:center; justify-content:center; flex:0 0 auto; }
  .segs { flex:1; display:flex; gap:4px; }
  .seg { height:8px; border-radius:99px; background:#ffffff; overflow:hidden; cursor:pointer; position:relative; }
  .seg i { position:absolute; left:0; top:0; bottom:0; width:100%; border-radius:99px;
    background:linear-gradient(90deg,var(--acc),var(--acc2)); transform:scaleX(0); transform-origin:0 0; }
  .seg.done i { transform:scaleX(1); }
  .clock { font-size:11px; color:var(--dim); font-variant-numeric:tabular-nums; min-width:78px; text-align:right; }
  .chips { display:flex; gap:7px; padding:9px 4px 2px; overflow-x:auto; scrollbar-width:none; }
  .chips::-webkit-scrollbar { display:none; }
  .chip { flex:1 0 auto; padding:9px 13px; border-radius:10px; border:1px solid var(--border); background:#ffffff;
    color:var(--dim); font-size:12px; font-weight:700; cursor:pointer; white-space:nowrap; }
  .chip.on { color:var(--acc); border-color:#c0d8d3; background:rgba(79,209,181,.08); }
  .chip .no { display:inline-block; width:17px; height:17px; margin-right:6px; border-radius:50%; text-align:center;
    line-height:17px; font-size:10.5px; background:#ffffff; color:var(--dim); }
  .chip.on .no { background:var(--acc); color:#ffffff; }
  /* 结尾卡 */
  .endcard { position:absolute; inset:0; z-index:70; display:none; flex-direction:column; align-items:center;
    justify-content:center; gap:13px; background:rgba(16,38,32,0.14); text-align:center; padding:20px; }
  .endcard.on { display:flex; }
  .endcard .ok { width:64px; height:64px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    font-size:31px; color:#ffffff; background:var(--acc);
    box-shadow:0 0 46px var(--glow); animation:pop .6s cubic-bezier(.34,1.4,.5,1) both; }
  .endcard p { font-size:14.5px; font-weight:800; color:var(--bright); line-height:1.6; }
  .endcard .ebtns { display:flex; gap:11px; margin-top:4px; flex-wrap:wrap; justify-content:center; }
  .endcard .e1 { padding:12px 28px; border-radius:999px; font-size:13.5px; font-weight:900; color:#ffffff; text-decoration:none;
    background:var(--acc); box-shadow:0 12px 36px var(--glow); }
  .endcard .e2 { padding:12px 28px; border-radius:999px; font-size:13.5px; font-weight:800; color:var(--txt);
    background:transparent; border:1px solid var(--border); cursor:pointer; font-family:inherit; }
  footer { text-align:center; padding:0 0 22px; font-size:11px; color:#3d5a53; letter-spacing:3px; }

/* ───────── 基础工具 ───────── */
const $ = (id) => document.getElementById(id);
const sceneEl = $('scene'), cursor = $('cursor'), subEl = $('sub'), stage = $('stage'), scaler = $('scaler');
const DW = 420, DH = 640;
let scale = 1;
function fitStage() {
  const availW = stage.parentElement.clientWidth - 2;
  const availH = Math.max(360, window.innerHeight - 300);
  scale = Math.min(availW / DW, availH / DH, 1.15);
  stage.style.width = Math.round(DW * scale) + 'px';
  stage.style.height = Math.round(DH * scale) + 'px';
  scaler.style.transform = 'scale(' + scale + ')';
  scaler.style.left = '0px';
}
window.addEventListener('resize', fitStage);
document.addEventListener('fullscreenchange', () => setTimeout(fitStage, 60));

function cursorTo(node, ms = 550) {
  const sr = scaler.getBoundingClientRect(), tr = node.getBoundingClientRect();
  const x = (tr.left + tr.width / 2 - sr.left) / scale, y = (tr.top + tr.height / 2 - sr.top) / scale;
  cursor.style.transition = 'transform ' + ms + 'ms cubic-bezier(.4,0,.2,1), opacity .3s';
  cursor.style.transform = 'translate(' + (x - 10) + 'px,' + (y - 10) + 'px)';
  cursor.style.opacity = '1';
}
function cursorHide() { cursor.style.opacity = '0'; }
function clickFx(node) {
  node.classList.remove('press'); void node.offsetWidth; node.classList.add('press');
  const sr = scaler.getBoundingClientRect(), tr = node.getBoundingClientRect();
  const x = (tr.left + tr.width / 2 - sr.left) / scale, y = (tr.top + tr.height / 2 - sr.top) / scale;
  const r = document.createElement('i'); r.className = 'ripple';
  r.style.left = x + 'px'; r.style.top = y + 'px';
  scaler.appendChild(r); setTimeout(() => r.remove(), 600);
}
function pulse(node) { node.classList.remove('pulse'); void node.offsetWidth; node.classList.add('pulse'); }
function confettiAt(node) {
  const sr = scaler.getBoundingClientRect(), tr = node.getBoundingClientRect();
  const cx = (tr.left + tr.width / 2 - sr.left) / scale, cy = (tr.top + tr.height / 2 - sr.top) / scale;
  const colors = ['#4fd1b5', '#8ff0dc', '#ffd76a', '#ff8f6a', '#7ab8ff'];
  for (let i = 0; i < 14; i++) {
    const c = document.createElement('i'); c.className = 'confetti';
    c.style.left = cx + 'px'; c.style.top = cy + 'px';
    c.style.background = colors[i % colors.length];
    c.style.setProperty('--dx', (Math.random() * 150 - 75) + 'px');
    c.style.animationDelay = (i * 30) + 'ms';
    scaler.appendChild(c); setTimeout(() => c.remove(), 1300);
  }
}

      const dim = document.createElement('div'); dim.className = 'dim'; site.appendChild(dim);
      const sheet = document.createElement('div'); sheet.className = 'sheet pay'; sheet.id = 'paySheet';
      sheet.innerHTML = '<div class="grab"></div><h4>' + t('m_pay') + '</h4>'
        + '<div class="amt"><b>1,000 SVX</b><span>30 天矿池</span></div>'
        + '<div class="fee">' + t('m_payfee') + '</div>'
        + '<div class="mbtns"><button class="mbtn ghost">' + t('m_reject')
        + '</button><button class="mbtn main" id="payOk">' + t('m_confirm') + '</button></div>';
      site.appendChild(sheet);
      const ok = sheet.querySelector('#payOk');
      const beats = [
        { t: 200, run: () => { dim.classList.add('on'); requestAnimationFrame(() => sheet.classList.add('on')); } },
        { t: 1000, run: () => { pulse(ok); cursorTo(ok); } },
        { t: 2000, run: () => {
            clickFx(ok);
            sheet.innerHTML = '<div class="spin"></div><div class="fee" style="text-align:center">' + t('m_pending') + '</div>';
          } },
        { t: 4000, run: () => {
            sheet.classList.remove('on'); dim.classList.remove('on'); cursorHide();
            act.className = 'pact busy'; act.textContent = t('m_pending');
            toast(t('m_payok'));
          } },
        { t: 6400, run: () => {
            act.className = 'pact done'; act.textContent = t('m_actdone');
            confettiAt(act); toast(t('m_grantok'));
          } },
      ];
      return beats;
    } },
  { key:'s7', dur:9000, caps:[[300,'c7']],
    build() {
      sceneEl.innerHTML = shell(minerListHtml(), { addr:true });
      const card = sceneEl.querySelector('#mcard');
      const beats = [
        { t: 600, run: () => cursorTo(card, 500) },
        { t: 1500, run: () => { sceneEl.querySelector('#pfill').style.width = '3.33%'; sceneEl.querySelector('#stP').innerHTML = '3.33<small>%</small>'; } },
        { t: 3200, run: () => { pulse(sceneEl.querySelector('#runPill')); cursorHide(); } },
      ];
      return beats;
    } },
];

/* ───────── 播放器时间线 ───────── */
const segsEl = $('segs'), chipsEl = $('chips'), clockEl = $('clock'), playBtn = $('playBtn');
const TOTAL = SCENES.reduce((s, x) => s + x.dur, 0);
let idx = 0, tms = 0, bi = 0, beats = [], playing = false, ended = false, capKey = '';

SCENES.forEach((s, i) => {
  const seg = document.createElement('div'); seg.className = 'seg';
  seg.style.flexGrow = String(s.dur / 1000);
  seg.innerHTML = '<i></i>';
  seg.onclick = () => seek(i);
  segsEl.appendChild(seg);
  const chip = document.createElement('div'); chip.className = 'chip';
  chip.innerHTML = '<span class="no">' + (i + 1) + '</span><span data-k="' + s.key + '">' + t(s.key) + '</span>';
  chip.onclick = () => seek(i);
  chipsEl.appendChild(chip);
});
const segFills = [...segsEl.querySelectorAll('.seg i')];
const segEls = [...segsEl.children];
const chipEls = [...chipsEl.children];

function fmt(ms) { const s = Math.round(ms / 1000); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); }
function updateHud() {
  const done = SCENES.slice(0, idx).reduce((s, x) => s + x.dur, 0);
  clockEl.textContent = fmt(done + Math.min(tms, SCENES[idx].dur)) + ' / ' + fmt(TOTAL);
  segFills.forEach((f, i) => {
    const p = i < idx ? 1 : i > idx ? 0 : Math.min(1, tms / SCENES[idx].dur);
    f.style.transform = 'scaleX(' + p + ')';
    segEls[i].classList.toggle('done', i < idx);
  });
  chipEls.forEach((c, i) => c.classList.toggle('on', i === idx));
}
function setCap(key) {
  if (key === capKey) return;
  capKey = key;
  subEl.style.opacity = '0';
  setTimeout(() => { subEl.textContent = t(key); subEl.style.opacity = '1'; }, 140);
}
subEl.style.transition = 'opacity .14s';

function load(i) {
  idx = i; tms = 0; bi = 0; ended = false;
  cursorHide(); cursor.style.transform = 'translate(-40px,-40px)';
  beats = SCENES[i].build() || [];
  beats.sort((a, b) => a.t - b.t);
  setCap(SCENES[i].caps[0][1]);
  $('endcard').classList.remove('on');
  sceneEl.classList.add('on');
  updateHud();
}
function next() {
  if (idx + 1 < SCENES.length) { load(idx + 1); return; }
  ended = true; playing = false; playBtn.textContent = '▶';
  cursorHide();
  $('endcard').classList.add('on');
}
function seek(i) { load(i); if (!playing && !ended) { playing = true; playBtn.textContent = '⏸'; } last = performance.now(); }
function togglePlay() {
  if (ended) { load(0); playing = true; playBtn.textContent = '⏸'; last = performance.now(); return; }
  playing = !playing; playBtn.textContent = playing ? '⏸' : '▶';
  last = performance.now();
}
playBtn.onclick = togglePlay;
$('replayBtn').onclick = () => { load(0); playing = true; playBtn.textContent = '⏸'; last = performance.now(); };
document.addEventListener('keydown', (e) => {
  if (e.code === 'Space' && !/INPUT|TEXTAREA/.test(document.activeElement?.tagName || '')) { e.preventDefault(); togglePlay(); }
});
$('fsBtn').onclick = () => {
  if (document.fullscreenElement) document.exitFullscreen();
  else $('player').requestFullscreen?.();
};

let last = performance.now();
function frame(now) {
  const dt = now - last; last = now;
  if (playing && !ended) {
    tms += dt;
    const cs = SCENES[idx];
    while (bi < beats.length && beats[bi].t <= tms) { try { beats[bi].run(); } catch (e) { console.error(e); } bi++; }
    const capHit = [...cs.caps].reverse().find(c => c[0] <= tms);
    if (capHit) setCap(capHit[1]);
    if (tms >= cs.dur) next(); else updateHud();
  }
  requestAnimationFrame(frame);
}

/* ───────── 语言菜单 & 静态文案 ───────── */
function applyLang() {
  document.documentElement.lang = cur === 'zh-TW' ? 'zh-TW' : cur;
  document.title = t('title');
  document.querySelectorAll('[data-k]').forEach(el => { el.textContent = t(el.dataset.k); });
  capKey = ''; setCap(SCENES[idx].caps[0][1]);
  if (!ended) load(idx);
  else $('endcard').querySelector('[data-k]').textContent = t('end1');
}
$('langBtn').onclick = (e) => {
  e.stopPropagation();
  let m = document.querySelector('.langmenu');
  if (m) { m.remove(); return; }
  m = document.createElement('div'); m.className = 'langmenu';
  const labels = [['zh', '简体中文'], ['zh-TW', '繁體中文'], ['en', 'English'], ['ja', '日本語'], ['ko', '한국어'], ['ru', 'Русский'], ['es', 'Español']];
  labels.forEach(([code, label]) => {
    const b = document.createElement('button');
    b.type = 'button';
    b.textContent = (code === cur ? '✓ ' : '　') + label;
    if (code === cur) b.classList.add('on');
    b.onclick = () => {
      cur = code;
      try { localStorage.setItem(KEY, cur); } catch {}
      m.remove(); applyLang();
    };
    m.appendChild(b);
  });
  const r = $('langBtn').getBoundingClientRect();
  m.style.top = (r.bottom + 6) + 'px';
  m.style.right = Math.max(8, window.innerWidth - r.right) + 'px';
  document.body.appendChild(m);
};
document.addEventListener('click', () => document.querySelector('.langmenu')?.remove());

/* ───────── 启动 ───────── */
fitStage();
document.querySelectorAll('[data-k]').forEach(el => { el.textContent = t(el.dataset.k); });
load(0);
playing = true; playBtn.textContent = '⏸';
requestAnimationFrame(frame);
</script>
</body>
</html>
