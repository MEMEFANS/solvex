<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>SVX 通缩模型</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:1080px; height:1920px; overflow:hidden; }
  body { font-family:"Microsoft YaHei","PingFang SC",sans-serif; color:#4f605b;
    background:
      radial-gradient(900px 500px at 50% -5%, rgba(79,209,181,.14), transparent 60%),
      radial-gradient(700px 400px at 50% 105%, rgba(79,209,181,.08), transparent 60%),
      linear-gradient(170deg,#ffffff 0%,#ffffff 55%,#ffffff 100%);
    position:relative; display:flex; flex-direction:column; padding:64px 70px 56px; }
  .wm { position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    font-size:230px; font-weight:900; letter-spacing:20px; color:rgba(11,114,100,0.045); pointer-events:none; }
  .top { display:flex; align-items:center; gap:20px; }
  .top img { width:76px; height:76px; border-radius:18px; box-shadow:0 0 30px rgba(16,38,32,0.16); }
  .brand { font-size:36px; font-weight:900; color:#16211e; }
  .brand b { color:#0b7264; }
  .hero { text-align:center; margin-top:70px; }
  .hero h1 { font-size:96px; font-weight:900; letter-spacing:6px;
    background:linear-gradient(100deg,#8ff0dc,#4fd1b5 50%,#b9f4e6);
    -webkit-background-clip:text; background-clip:text; color:transparent;
    text-shadow:0 0 60px rgba(16,38,32,0.16); }
  .hero p { margin-top:22px; font-size:32px; color:#5b6b66; letter-spacing:10px; }
  .flow { margin-top:80px; display:flex; flex-direction:column; align-items:center; }
  .node { background:linear-gradient(180deg,#ffffff,#ffffff); border:1px solid #d9e4e0;
    border-radius:22px; padding:28px 60px; text-align:center; min-width:560px; }
  .node .t { font-size:34px; font-weight:900; color:#16211e; }
  .node .s { margin-top:8px; font-size:23px; color:#5b6b66; }
  .arrow { font-size:44px; color:#0b7264; line-height:1.5; margin:10px 0; }
  .split { display:flex; gap:36px; margin-top:14px; width:100%; }
  .half { flex:1; border-radius:26px; padding:44px 30px; text-align:center; position:relative; overflow:hidden; }
  .half.burn { background:linear-gradient(180deg,rgba(242,108,120,.10),rgba(242,108,120,.03));
    border:2px solid #d6c2c5; }
  .half.pool { background:linear-gradient(180deg,rgba(79,209,181,.10),rgba(79,209,181,.03));
    border:2px solid #c0d8d3; }
  .half .pct { font-size:110px; font-weight:900; line-height:1; }
  .burn .pct { color:#c62a37; text-shadow:0 0 50px rgba(16,38,32,0.16); }
  .pool .pct { color:#0b7264; text-shadow:0 0 50px rgba(16,38,32,0.16); }
  .half .pct small { font-size:44px; }
  .half .nm { margin-top:16px; font-size:38px; font-weight:900; color:#16211e; }
  .half .ds { margin-top:14px; font-size:24px; line-height:1.7; color:#4f605b; }
  .loop { margin-top:64px; background:linear-gradient(180deg,#ffffff,#ffffff);
    border:1px solid #d9e4e0; border-radius:26px; padding:40px 48px; }
  .loop h3 { font-size:30px; font-weight:900; color:#0b7264; display:flex; align-items:center; gap:14px; }
  .loop h3::before { content:""; width:12px; height:12px; border-radius:50%; background:#4fd1b5; box-shadow:0 0 12px #102620; }
  .loop p { margin-top:20px; font-size:26px; line-height:1.9; color:#4f605b; }
  .loop p b { color:#0b7264; }
  .cta { margin-top:auto; text-align:center; }
  .cta .btn { display:inline-block; font-size:44px; font-weight:900; color:#04211b; letter-spacing:8px;
    background:linear-gradient(135deg,#8ff0dc,#4fd1b5); border-radius:999px; padding:30px 110px;
    box-shadow:0 20px 60px rgba(16,38,32,0.16); }
  .foot { margin-top:40px; text-align:center; font-size:22px; color:#3d5a53; letter-spacing:5px; }
</style>
</head>
<body>
<div class="wm">BURN</div>
<div class="top">
  <img src="assets/brand/logo.png?v=20261111-domain-solvex-logo-3" alt="Solvex">
  <div class="brand">Solve<b>x</b> Exchange</div>
</div>

<div class="hero">
  <h1>SVX 通缩模型</h1>
  <p>每笔卖出 · 持续销毁</p>
</div>

<div class="flow">
  <div class="node">
    <div class="t">每笔 SVX 卖出交易</div>
    <div class="s">手续费按持有直推人数阶梯收取（50% ~ 3%）</div>
  </div>
  <div class="arrow">↓</div>
  <div class="split">
    <div class="half burn">
      <div class="pct">50<small>%</small></div>
      <div class="nm">当场销毁</div>
      <div class="ds">代币永久退出流通<br>流通量只减不增</div>
    </div>
    <div class="half pool">
      <div class="pct">50<small>%</small></div>
      <div class="nm">A10 分红池</div>
      <div class="ds">每日 00:00 自动结算<br>A10 级别均分</div>
    </div>
  </div>
</div>

<div class="loop">
  <h3>为什么这是价值飞轮</h3>
  <p>交易越多 → 销毁越多 → <b>流通量持续收缩</b> → 分红池越滚越大。<br>通缩不是口号，是<b>写进每笔交易的机制</b>。</p>
</div>

<div class="cta"><span class="btn">持有一份通缩资产</span></div>
<div class="foot">SOLVEX EXCHANGE · BNB SMART CHAIN</div>
</body>
</html>
